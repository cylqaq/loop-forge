name: round-cycle
description: Loop 外循环标准链 — Intent 到 Adjustment 五阶段
version: 1

steps:
  - id: intent
    skill: loop-orchestrator
    manifest: round-start
    phase: 00-intent
    description: 读 CURRENT，确认窄目标与验收

  - id: context
    skill: navigator
    manifest: round-start
    phase: 01-context
    description: INDEX 导航，输出 context-plan

  - id: action
    skill: implementer
    manifest: round-action
    phase: 02-action
    description: 实现变更

  - id: observe
    skill: tester
    manifest: round-observe
    phase: 03-observation
    description: 执行 allowlisted verify gate，记录客观结果

  - id: review
    skill: reviewer
    manifest: round-review
    phase: 03-observation
    description: 独立会话审查；写入绑定本次 run 的 APPROVED 回执

  - id: adjust
    skill: loop-orchestrator
    manifest: round-adjust
    phase: 04-adjustment
    description: 消费 APPROVED 回执，更新 CURRENT、决策账本（热/冷）、loop-state

handoff:
  protocol: one_skill_per_session
  complete_command: loop handoff complete
