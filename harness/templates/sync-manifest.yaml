  - harness/context-budget.yaml
  - harness/project-capabilities.yaml
  - harness/workflows/round-cycle.yaml
  - harness/manifests/round-start.yaml
  - harness/manifests/round-action.yaml
  - harness/manifests/round-close.yaml
  - harness/manifests/round-observe.yaml
  - harness/manifests/round-review.yaml
  - harness/manifests/round-adjust.yaml
  - harness/templates/loop-state.json.template
  - scripts/before-start.mjs
  - scripts/verify-loop.mjs
